name: build-and-push

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Mirrors jasonm4130-labs/transcoder's Blacksmith setup.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # v2 ignores the v1 max-cache-size-mb input; the final prune step bounds
      # retained cache before the post action commits the sticky disk.
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: gphotos-takeout-sync/Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # namespace follows the org (jasonm4130-labs)
          images: ghcr.io/${{ github.repository_owner }}/gphotos-takeout-sync
          # latest=auto tags the highest non-prerelease semver as :latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Prune only after success: Blacksmith does not commit failed jobs' disks.
      # v2's own GC is age-based (unused for 8 days), so this is what bounds the
      # sticky disk's size. A retention target, not a peak limit.
      - name: Retain up to 5 GiB of Docker build cache
        timeout-minutes: 5
        run: |
          docker buildx du
          docker buildx prune --force --all --max-used-space 5gb
          docker buildx du
